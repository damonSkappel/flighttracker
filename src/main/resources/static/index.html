<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            z-index: 1000;
        }

        #header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #4fc3f7;
        }

        #stats-bar {
            display: flex;
            gap: 24px;
            font-size: 0.85rem;
            color: #aaa;
        }

        #stats-bar span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #stats-bar .value {
            color: #4fc3f7;
            font-weight: 600;
        }

        #status {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: #0f3460;
            color: #4fc3f7;
        }

        #status.error {
            background: #3d0000;
            color: #ff6b6b;
        }

        #map {
            flex: 1;
        }

        .leaflet-popup-content-wrapper {
            background: #16213e;
            color: #eee;
            border: 1px solid #0f3460;
            border-radius: 8px;
        }

        .leaflet-popup-tip {
            background: #16213e;
        }

        .popup-content {
            min-width: 180px;
        }

        .popup-callsign {
            font-size: 1rem;
            font-weight: 700;
            color: #4fc3f7;
            margin-bottom: 8px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 6px;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            margin: 4px 0;
            color: #ccc;
        }

        .popup-row .label {
            color: #888;
        }

        .popup-row .val {
            color: #eee;
            font-weight: 500;
            text-align: right;
            margin-left: 8px;
        }
        .aircraft-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plane-icon {
            /* Rotate about the centre so the anchor stays on the position fix. */
            transform-origin: 50% 50%;
            display: block;
        }

        .leaflet-tile {
            filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(90%) saturate(60%);
        }
    </style>
</head>
<body>

<div id="header">
    <h1>✈ FLIGHT TRACKER</h1>
    <div id="stats-bar">
        <span>Aircraft: <span class="value" id="aircraft-count">—</span></span>
        <span>Last update: <span class="value" id="last-update">—</span></span>
    </div>
    <div id="status">Connecting...</div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
    // ─── Map Setup ─────────────────────────────────────────────────────────────

    const map = L.map('map', {
        center: [39.5, -98.35],
        zoom: 5,
        zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    // Every aircraft is drawn individually; there is no clustering. What keeps
    // that affordable is viewport culling in renderTracks -- only tracks near
    // the screen are attached to the map, so the DOM holds the couple of hundred
    // markers you can actually see rather than every aircraft in the country.
    const flightLayer = L.layerGroup().addTo(map);
    // Holds the selected aircraft's trail. Polylines draw in the overlay pane,
    // beneath the marker pane, so the trail never covers an icon.
    const trailLayer = L.layerGroup().addTo(map);

    // Fraction of the viewport kept attached beyond the visible edges, so a small
    // pan does not pop markers in at the border.
    const VIEWPORT_PAD = 0.25;

    // ─── Dead reckoning tuning ─────────────────────────────────────────────────

    // Stop projecting once a fix is this old. This matters: OpenSky does return
    // aircraft whose last position report is well over an hour old, and
    // projecting one of those forward unbounded would place it hundreds of miles
    // away, moving smoothly and looking entirely correct.
    //
    // The floor is set by how stale a fix the browser can be holding:
    //   OpenSky's own lag (~20s) + server poll (120s) + fetch interval (30s) = 170s
    // Below that, aircraft freeze at the cap before their replacement arrives.
    // Above it, we are guessing further than we need to, and an unseen turn puts
    // the icon further from the real aircraft. Both terms matter, so changing
    // FETCH_INTERVAL_MS or the server poll should move this too.
    const MAX_EXTRAPOLATION_S = 180;
    // Start dimming here, so a coasting icon visibly loses confidence. Sits just
    // under one poll interval plus OpenSky's own ~20s lag, so a normally
    // refreshed aircraft only dims at the very end of a cycle.
    const STALE_FADE_S = 120;
    const STALE_MIN_OPACITY = 0.35;
    // How long to bleed off the correction when a real fix disagrees with where
    // we had guessed the aircraft was.
    const SNAP_MS = 800;
    // Aircraft move slowly in screen terms, so full refresh rate buys nothing
    // visible and costs battery. ~15fps is indistinguishable here.
    const RENDER_INTERVAL_MS = 66;

    // How often to ask the server for new fixes. This is deliberately far slower
    // than the render loop: the server itself only refreshes every 120s, so a
    // faster fetch just re-downloads identical data. Before dead reckoning a
    // fetch was the only thing that moved an aircraft, so it had to be frequent;
    // now icons coast between fixes and the map looks the same either way.
    //
    // 30s is the accuracy-favouring choice over a longer interval: it keeps
    // MAX_EXTRAPOLATION_S low, so aircraft are guessed forward less far. Must
    // stay well under flighttracker.active-window-minutes.
    const FETCH_INTERVAL_MS = 30000;
    // Below this ground speed treat the aircraft as parked.
    const MIN_ANIMATE_SPEED_MPS = 5;

    // ─── Trail tuning ──────────────────────────────────────────────────────────

    // The server clamps history to 500 rows. Retention is 6h at a 2-minute poll,
    // about 180 rows, so asking for the maximum gets the whole retained track.
    const TRAIL_HISTORY_LIMIT = 500;
    // Fixes further apart than this are not joined. Retention can hold an earlier
    // leg of the same airframe, and a straight line across the gap -- or across a
    // stretch outside receiver coverage -- would claim a route it never flew.
    const TRAIL_GAP_S = 600;
    const TRAIL_STYLE = { color: '#4fc3f7', weight: 2, opacity: 0.8, interactive: false };
    // Dashed: from the last reported fix to where the icon is being dead-reckoned.
    // It is a guess, and should read as one next to the reported track.
    const LEAD_STYLE = { color: '#4fc3f7', weight: 2, opacity: 0.6, dashArray: '4 6', interactive: false };

    // ─── Geo helpers ───────────────────────────────────────────────────────────
    // Pure functions: no map or DOM state. These are what position extrapolation
    // will be built from.

    const EARTH_RADIUS_M = 6371008.8;
    const KNOTS_TO_MPS = 0.514444;

    function toRad(deg) { return deg * Math.PI / 180; }
    function toDeg(rad) { return rad * 180 / Math.PI; }

    /**
     * Great-circle destination point. A flat lat/lon offset visibly drifts at
     * altitude and at high latitude, so project properly even over short hops.
     * Returns the input position unchanged when there is nothing to project.
     */
    function projectPosition(lat, lon, headingDeg, speedMps, elapsedSeconds) {
        if (speedMps == null || headingDeg == null || !(elapsedSeconds > 0)) {
            return [lat, lon];
        }
        const delta = (speedMps * elapsedSeconds) / EARTH_RADIUS_M;
        const theta = toRad(headingDeg);
        const phi1 = toRad(lat);
        const lambda1 = toRad(lon);

        const sinPhi2 = Math.sin(phi1) * Math.cos(delta)
            + Math.cos(phi1) * Math.sin(delta) * Math.cos(theta);
        const phi2 = Math.asin(Math.max(-1, Math.min(1, sinPhi2)));
        const lambda2 = lambda1 + Math.atan2(
            Math.sin(theta) * Math.sin(delta) * Math.cos(phi1),
            Math.cos(delta) - Math.sin(phi1) * sinPhi2
        );
        // Keep longitude in [-180, 180) across the antimeridian.
        return [toDeg(phi2), ((toDeg(lambda2) + 540) % 360) - 180];
    }

    /**
     * Rewrites `to` as the nearest equivalent angle to `from`, so interpolating
     * 350deg -> 10deg travels 20deg forward rather than 340deg backward.
     */
    function unwrapHeading(from, to) {
        return from + (((to - from + 540) % 360) - 180);
    }

    function normalizeHeading(deg) { return ((deg % 360) + 360) % 360; }

    /**
     * Epoch seconds of the aircraft's own position report. This -- not the row's
     * ingest timestamp -- is the epoch to measure elapsed time from. Falls back
     * to ingest time only when OpenSky sent no position time.
     */
    function fixEpochSeconds(flight) {
        if (flight.timePosition != null) return flight.timePosition;
        if (flight.lastSeen) {
            const parsed = Date.parse(flight.lastSeen);
            if (!Number.isNaN(parsed)) return parsed / 1000;
        }
        return null;
    }

    function fixAgeSeconds(fixEpoch, nowMs) {
        if (fixEpoch == null) return null;
        return ((nowMs == null ? Date.now() : nowMs) / 1000) - fixEpoch;
    }

    // ─── Aircraft Icon ──────────────────────────────────────────────────────────

    // Nose points to 12 o'clock at rotation 0, so the CSS rotation is the
    // compass heading verbatim (0 = north, 90 = east). Drawn as inline SVG
    // rather than the U+2708 glyph: that glyph's resting orientation is
    // font-dependent (it pointed east here, putting the left wing on the
    // course line), and it renders as a color emoji on some platforms.
    const PLANE_PATH = 'M12 2 L13.5 7.5 L22 13 L22 15 L13.5 12.5 L13.5 18.5 '
        + 'L16 20.5 L16 22 L12 20.8 L8 22 L8 20.5 L10.5 18.5 L10.5 12.5 '
        + 'L2 15 L2 13 L10.5 7.5 Z';

    function createAircraftIcon(heading, onGround) {
        const color = onGround ? '#888888' : '#4fc3f7';
        const size = onGround ? 16 : 20;
        const rotation = heading != null ? heading : 0;

        return L.divIcon({
            html: `<svg class="plane-icon" viewBox="0 0 24 24" width="${size}" height="${size}"
                 style="transform: rotate(${rotation}deg);">
                <path d="${PLANE_PATH}" fill="${color}"
                      stroke="rgba(10,10,26,0.85)" stroke-width="0.75"
                      stroke-linejoin="round"/>
            </svg>`,
            className: 'aircraft-icon',
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2]
        });
    }

    /**
     * Rotates an existing marker by touching the SVG transform directly.
     * Rebuilding the icon would reparse HTML for every aircraft on every frame.
     * Returns false when the marker has no rendered element yet.
     */
    function applyRotation(entry, heading) {
        const el = entry.marker.getElement();
        if (!el) return false;
        const svg = el.querySelector('.plane-icon');
        if (!svg) return false;
        svg.style.transform = `rotate(${heading}deg)`;
        return true;
    }

    // ─── Popup Content ──────────────────────────────────────────────────────────

    // Popup HTML is assembled as a string and handed to bindPopup, which assigns
    // it as innerHTML. Callsign and country originate from OpenSky -- operator-
    // supplied strings relayed by a public network -- so they are untrusted and
    // must never reach the parser as markup.
    function esc(value) {
        if (value == null) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ─── Aircraft Type ──────────────────────────────────────────────────────────

    // Readable names for the ICAO designators most often seen over the US. The
    // aircraft database's own model string is often blank or a sub-variant
    // ("737-8H4"), so a curated name wins where there is one; anything else falls
    // back to manufacturer + model, then to the bare designator.
    const TYPE_NAMES = {
        A19N: 'Airbus A319neo', A20N: 'Airbus A320neo', A21N: 'Airbus A321neo',
        A318: 'Airbus A318', A319: 'Airbus A319', A320: 'Airbus A320', A321: 'Airbus A321',
        A332: 'Airbus A330-200', A333: 'Airbus A330-300', A339: 'Airbus A330-900neo',
        A343: 'Airbus A340-300', A346: 'Airbus A340-600',
        A359: 'Airbus A350-900', A35K: 'Airbus A350-1000', A388: 'Airbus A380-800',
        BCS1: 'Airbus A220-100', BCS3: 'Airbus A220-300',
        B712: 'Boeing 717', B733: 'Boeing 737-300', B734: 'Boeing 737-400',
        B735: 'Boeing 737-500', B736: 'Boeing 737-600', B737: 'Boeing 737-700',
        B738: 'Boeing 737-800', B739: 'Boeing 737-900',
        B37M: 'Boeing 737 MAX 7', B38M: 'Boeing 737 MAX 8', B39M: 'Boeing 737 MAX 9',
        B3XM: 'Boeing 737 MAX 10',
        B744: 'Boeing 747-400', B748: 'Boeing 747-8',
        B752: 'Boeing 757-200', B753: 'Boeing 757-300',
        B762: 'Boeing 767-200', B763: 'Boeing 767-300', B764: 'Boeing 767-400',
        B772: 'Boeing 777-200', B77L: 'Boeing 777-200LR', B773: 'Boeing 777-300',
        B77W: 'Boeing 777-300ER', B778: 'Boeing 777-8', B779: 'Boeing 777-9',
        B788: 'Boeing 787-8', B789: 'Boeing 787-9', B78X: 'Boeing 787-10',
        MD11: 'McDonnell Douglas MD-11', MD88: 'McDonnell Douglas MD-88',
        MD90: 'McDonnell Douglas MD-90',
        CRJ2: 'Bombardier CRJ200', CRJ7: 'Bombardier CRJ700',
        CRJ9: 'Bombardier CRJ900', CRJX: 'Bombardier CRJ1000',
        E135: 'Embraer ERJ-135', E145: 'Embraer ERJ-145',
        E170: 'Embraer E170', E75L: 'Embraer E175', E75S: 'Embraer E175',
        E190: 'Embraer E190', E195: 'Embraer E195', E290: 'Embraer E190-E2',
        E295: 'Embraer E195-E2',
        DH8A: 'Dash 8-100', DH8B: 'Dash 8-200', DH8C: 'Dash 8-300', DH8D: 'Dash 8-400',
        AT43: 'ATR 42-300', AT45: 'ATR 42-500', AT72: 'ATR 72', AT75: 'ATR 72-500',
        AT76: 'ATR 72-600',
        C172: 'Cessna 172 Skyhawk', C182: 'Cessna 182 Skylane', C208: 'Cessna 208 Caravan',
        C25A: 'Cessna Citation CJ2', C25B: 'Cessna Citation CJ3', C56X: 'Cessna Citation Excel',
        C68A: 'Cessna Citation Latitude', C700: 'Cessna Citation Longitude',
        BE20: 'Beechcraft King Air 200', B350: 'Beechcraft King Air 350',
        PC12: 'Pilatus PC-12', PC24: 'Pilatus PC-24', SR22: 'Cirrus SR22',
        CL30: 'Bombardier Challenger 300', CL35: 'Bombardier Challenger 350',
        CL60: 'Bombardier Challenger 600', GL5T: 'Bombardier Global 5000',
        GLEX: 'Bombardier Global Express', GL7T: 'Bombardier Global 7500',
        GLF4: 'Gulfstream IV', GLF5: 'Gulfstream V', GLF6: 'Gulfstream G650',
        E55P: 'Embraer Phenom 300', E50P: 'Embraer Phenom 100',
        C130: 'Lockheed C-130 Hercules', C17: 'Boeing C-17 Globemaster III',
        K35R: 'Boeing KC-135 Stratotanker'
    };

    /**
     * icao24 -> the /flights/{icao24}/type response. Only hits are cached: a 404
     * can mean the aircraft database is still loading, so it is asked again the
     * next time that popup opens.
     */
    const aircraftTypes = new Map();

    function typeName(info) {
        if (!info) return null;
        if (info.typecode && TYPE_NAMES[info.typecode]) return TYPE_NAMES[info.typecode];
        if (info.model) {
            // Models often already lead with the maker ("Airbus A380 861").
            const maker = info.manufacturer;
            return maker && !info.model.toLowerCase().startsWith(maker.toLowerCase())
                ? maker + ' ' + info.model
                : info.model;
        }
        return info.typecode;
    }

    async function showType(icao24) {
        if (aircraftTypes.has(icao24)) return;
        let info;
        try {
            const response = await fetch(`/flights/${encodeURIComponent(icao24)}/type`);
            if (response.status === 404) return;
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            info = await response.json();
        } catch (error) {
            console.error('Failed to fetch type for ' + icao24 + ':', error);
            return;
        }
        aircraftTypes.set(icao24, info);
        const entry = tracks.get(icao24);
        if (entry && entry.marker.isPopupOpen()) {
            entry.marker.setPopupContent(buildPopup(entry.flight));
        }
    }

    function buildPopup(flight) {
        const callsign = esc(flight.callsign || flight.icao24 || 'Unknown');
        const type = aircraftTypes.get(flight.icao24);
        const name = typeName(type);
        const typeText = !name ? '—'
            : type.typecode && type.typecode !== name
                ? `${esc(name)} <span class="label">${esc(type.typecode)}</span>`
                : esc(name);
        const registration = flight.registration || (type && type.registration);
        const operatorRow = type && type.operator ? `
                <div class="popup-row">
                    <span class="label">Operator</span>
                    <span class="val">${esc(type.operator)}</span>
                </div>` : '';
        const altitude = flight.altitudeFeet != null
            ? Math.round(flight.altitudeFeet).toLocaleString() + ' ft'
            : '—';
        const speed = flight.velocityKnots != null
            ? Math.round(flight.velocityKnots) + ' kts'
            : '—';
        const heading = flight.heading != null
            ? Math.round(flight.heading) + '°'
            : '—';
        const vertRate = flight.verticalRate != null
            ? (flight.verticalRate > 0 ? '▲ ' : '▼ ')
            + Math.abs(Math.round(flight.verticalRate)) + ' m/s'
            : '—';
        const status = flight.onGround ? '🟡 On Ground' : '🔵 Airborne';
        const age = fixAgeSeconds(fixEpochSeconds(flight));
        const ageText = age == null ? '—'
            : age < 60 ? Math.round(age) + 's ago'
            : Math.round(age / 60) + 'm ago';

        return `
            <div class="popup-content">
                <div class="popup-callsign">${callsign}</div>
                <div class="popup-row">
                    <span class="label">Type</span>
                    <span class="val">${typeText}</span>
                </div>${operatorRow}
                <div class="popup-row">
                    <span class="label">ICAO24</span>
                    <span class="val">${esc(flight.icao24)}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Tail #</span>
                    <span class="val">${esc(registration) || '—'}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Country</span>
                    <span class="val">${esc(flight.originCountry) || '—'}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Status</span>
                    <span class="val">${status}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Altitude</span>
                    <span class="val">${altitude}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Speed</span>
                    <span class="val">${speed}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Heading</span>
                    <span class="val">${heading}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Vert. Rate</span>
                    <span class="val">${vertRate}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Position fix</span>
                    <span class="val">${ageText}</span>
                </div>
            </div>
        `;
    }

    // ─── Track Registry ─────────────────────────────────────────────────────────

    /**
     * icao24 -> {
     *   marker,   L.Marker, reused across polls so it can be moved rather than
     *             rebuilt -- this persistence is what animation requires
     *   flight,   the latest /flights row, kept to rebuild the popup when its
     *             aircraft type arrives
     *   fix,      last known truth from the server: position, course, speed and
     *             the epoch that position was reported at
     *   blend,    decaying correction applied while easing onto a new fix
     *   shown,    what is currently on screen, so no-op DOM writes are skipped
     *   attached  whether the marker is currently in the map layer
     * }
     */
    const tracks = new Map();

    function toFix(flight) {
        return {
            lat: flight.latitude,
            lon: flight.longitude,
            heading: flight.heading,
            // Prefer the raw m/s the API now sends; fall back to un-converting.
            speedMps: flight.velocityMps != null
                ? flight.velocityMps
                : (flight.velocityKnots != null ? flight.velocityKnots * KNOTS_TO_MPS : null),
            epochSeconds: fixEpochSeconds(flight),
            onGround: !!flight.onGround
        };
    }

    /** An aircraft only coasts if it is airborne and actually moving. */
    function isMoving(fix) {
        return !fix.onGround
            && fix.heading != null
            && fix.speedMps != null
            && fix.speedMps >= MIN_ANIMATE_SPEED_MPS;
    }

    /**
     * Where this fix says the aircraft is *now*: its reported position carried
     * forward along its heading for as long as the fix has been sitting unrefreshed.
     * Capped at MAX_EXTRAPOLATION_S, because a fix old enough to be stale is also
     * old enough that the aircraft may have turned.
     */
    function extrapolate(fix, nowMs) {
        const rawAge = fixAgeSeconds(fix.epochSeconds, nowMs);
        const age = rawAge == null ? 0 : Math.max(0, rawAge);
        const carried = isMoving(fix) ? Math.min(age, MAX_EXTRAPOLATION_S) : 0;
        const projected = projectPosition(fix.lat, fix.lon, fix.heading, fix.speedMps, carried);
        return { lat: projected[0], lon: projected[1], age: age };
    }

    /** Eases out, so the correction moves fast at first and settles gently. */
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    /** Opacity falls off as a fix ages, so a coasting icon reads as less certain. */
    function staleOpacity(age) {
        if (age <= STALE_FADE_S) return 1;
        if (age >= MAX_EXTRAPOLATION_S) return STALE_MIN_OPACITY;
        const t = (age - STALE_FADE_S) / (MAX_EXTRAPOLATION_S - STALE_FADE_S);
        // Rounded so imperceptible changes do not each cost a style write.
        return Math.round((1 - t * (1 - STALE_MIN_OPACITY)) * 100) / 100;
    }

    function planeSvg(entry) {
        const el = entry.marker.getElement();
        return el ? el.querySelector('.plane-icon') : null;
    }

    function upsertTrack(flight, nowMs) {
        const fix = toFix(flight);
        let entry = tracks.get(flight.icao24);

        if (!entry) {
            const spawn = extrapolate(fix, nowMs);
            const marker = L.marker([spawn.lat, spawn.lon], {
                icon: createAircraftIcon(fix.heading, fix.onGround)
            });
            marker.bindPopup(buildPopup(flight), {
                maxWidth: 220,
                className: 'flight-popup'
            });
            const icao24 = flight.icao24;
            marker.on('popupopen', () => {
                showTrail(icao24);
                showType(icao24);
            });
            marker.on('popupclose', () => clearTrail(icao24));
            entry = {
                marker,
                flight,
                fix: fix,
                blend: null,
                // Matches what the marker was just built with, so the first
                // render does not redundantly re-set position and icon.
                shown: {
                    lat: spawn.lat, lon: spawn.lon,
                    heading: fix.heading, onGround: fix.onGround, opacity: 1
                },
                attached: false
            };
            tracks.set(flight.icao24, entry);
            return entry;
        }

        // A real fix has arrived and it will not agree with where we had guessed
        // the aircraft was. Record that disagreement and let it decay, so the
        // icon glides onto the truth instead of teleporting to it.
        const guessed = extrapolate(entry.fix, nowMs);
        const previousHeading = entry.fix.heading;
        entry.fix = fix;
        entry.flight = flight;
        const truth = extrapolate(fix, nowMs);

        let headingGap = 0;
        if (previousHeading != null && fix.heading != null) {
            headingGap = unwrapHeading(fix.heading, previousHeading) - fix.heading;
        }
        const latGap = guessed.lat - truth.lat;
        const lonGap = guessed.lon - truth.lon;

        entry.blend = (latGap || lonGap || headingGap)
            ? { dLat: latGap, dLon: lonGap, dHeading: headingGap, startMs: nowMs }
            : null;

        if (trail && trail.icao24 === flight.icao24) appendTrailFix(fix, entry.shown);

        if (entry.marker.getPopup()) {
            // setPopupContent rather than rebind: rebinding closes a popup the
            // user currently has open.
            entry.marker.setPopupContent(buildPopup(flight));
        }
        return entry;
    }

    function pruneTracks(seen) {
        for (const [icao24, entry] of tracks) {
            if (seen.has(icao24)) continue;
            if (entry.attached) flightLayer.removeLayer(entry.marker);
            tracks.delete(icao24);
        }
    }

    /**
     * Draws every track where it should be at `nowMs`: the last fix carried
     * forward, plus whatever is left of the correction from the most recent one.
     * Runs on the animation loop, so this is the hot path -- values are computed
     * freely but only written to the DOM when they actually changed.
     */
    function renderTracks(nowMs) {
        const bounds = map.getBounds().pad(VIEWPORT_PAD);

        for (const [icao24, entry] of tracks) {
            const fix = entry.fix;
            const target = extrapolate(fix, nowMs);

            let lat = target.lat;
            let lon = target.lon;
            let heading = fix.heading;

            if (entry.blend) {
                const t = (nowMs - entry.blend.startMs) / SNAP_MS;
                if (t >= 1) {
                    entry.blend = null;
                } else {
                    const remaining = 1 - easeOutCubic(t);
                    lat += entry.blend.dLat * remaining;
                    lon += entry.blend.dLon * remaining;
                    if (heading != null) heading += entry.blend.dHeading * remaining;
                }
            }

            const visible = bounds.contains([lat, lon]);

            if (visible && !entry.attached) {
                // Re-attaching rebuilds the DOM element from options.icon, which
                // would otherwise resurrect the rotation baked in at creation
                // time, so hand it a correctly oriented icon on the way in.
                entry.marker.setLatLng([lat, lon]);
                entry.marker.setIcon(createAircraftIcon(heading, fix.onGround));
                entry.shown = {
                    lat: lat, lon: lon, heading: heading,
                    onGround: fix.onGround, opacity: 1
                };
                flightLayer.addLayer(entry.marker);
                entry.attached = true;
            } else if (!visible && entry.attached) {
                flightLayer.removeLayer(entry.marker);
                entry.attached = false;
            }

            if (!entry.attached) continue;

            const shown = entry.shown;

            if (lat !== shown.lat || lon !== shown.lon) {
                entry.marker.setLatLng([lat, lon]);
                shown.lat = lat;
                shown.lon = lon;
                if (trail && trail.icao24 === icao24) updateTrailLead(lat, lon);
            }

            // A change of ground state changes the icon's colour and size, so it
            // has to be rebuilt; a plain course change only moves the transform.
            if (fix.onGround !== shown.onGround) {
                entry.marker.setIcon(createAircraftIcon(heading, fix.onGround));
                shown.onGround = fix.onGround;
                shown.heading = heading;
                shown.opacity = 1;
            } else if (heading != null && heading !== shown.heading) {
                const svg = planeSvg(entry);
                if (svg) {
                    svg.style.transform = 'rotate(' + normalizeHeading(heading) + 'deg)';
                    shown.heading = heading;
                }
            }

            const opacity = staleOpacity(target.age);
            if (opacity !== shown.opacity) {
                const svg = planeSvg(entry);
                if (svg) {
                    svg.style.opacity = opacity;
                    shown.opacity = opacity;
                }
            }
        }
    }

    // ─── Flight Trail ───────────────────────────────────────────────────────────

    /**
     * The one trail on screen, belonging to the aircraft whose popup is open:
     * {
     *   icao24,
     *   segments,   arrays of [lat, lon], split wherever fixes are TRAIL_GAP_S apart
     *   lastEpoch,  epoch seconds of the newest point, so a repeated fix is not re-added
     *   line,       solid L.polyline over the reported positions
     *   lead        dashed L.polyline from the newest fix to the moving icon
     * }
     * line and lead are null while the history request is in flight.
     */
    let trail = null;

    /** Epoch seconds of a history row: the aircraft's own report, else ingest time. */
    function historyEpochSeconds(row) {
        if (row.timePosition != null) return row.timePosition;
        const parsed = Date.parse(row.timestamp);
        return Number.isNaN(parsed) ? null : parsed / 1000;
    }

    /**
     * Adds one point to the open trail. OpenSky repeats an aircraft's last fix
     * across polls while no new report arrives, so anything not newer than the
     * trail's end is dropped rather than stacked.
     */
    function addTrailPoint(lat, lon, epoch) {
        if (lat == null || lon == null || epoch == null) return false;
        if (trail.lastEpoch != null && epoch <= trail.lastEpoch) return false;

        const startNew = trail.segments.length === 0
            || epoch - trail.lastEpoch > TRAIL_GAP_S;
        if (startNew) trail.segments.push([]);
        trail.segments[trail.segments.length - 1].push([lat, lon]);
        trail.lastEpoch = epoch;
        return true;
    }

    /** A fresh fix from the regular fetch extends the open trail without refetching. */
    function appendTrailFix(fix, shown) {
        if (!trail.line) return; // history still loading; it will include this fix
        if (addTrailPoint(fix.lat, fix.lon, fix.epochSeconds)) {
            trail.line.setLatLngs(trail.segments);
            // The lead now starts from this fix. A coasting icon would redraw it
            // on the next frame anyway, but a parked one never moves to trigger it.
            updateTrailLead(shown.lat, shown.lon);
        }
    }

    function updateTrailLead(lat, lon) {
        if (!trail.lead || trail.segments.length === 0) return;
        const last = trail.segments[trail.segments.length - 1];
        trail.lead.setLatLngs([last[last.length - 1], [lat, lon]]);
    }

    async function showTrail(icao24) {
        clearTrail();
        const pending = { icao24, segments: [], lastEpoch: null, line: null, lead: null };
        trail = pending;

        let history;
        try {
            const response = await fetch(
                `/flights/${encodeURIComponent(icao24)}/history?limit=${TRAIL_HISTORY_LIMIT}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            history = await response.json();
        } catch (error) {
            console.error('Failed to fetch trail for ' + icao24 + ':', error);
            return;
        }
        // The popup was closed, or another opened, while the request was out.
        if (trail !== pending) return;

        // The API returns newest first; a line is drawn oldest to newest.
        for (let i = history.length - 1; i >= 0; i--) {
            const row = history[i];
            addTrailPoint(row.latitude, row.longitude, historyEpochSeconds(row));
        }
        // The regular fetch may have delivered a newer fix than the history had.
        const entry = tracks.get(icao24);
        if (entry) addTrailPoint(entry.fix.lat, entry.fix.lon, entry.fix.epochSeconds);

        pending.line = L.polyline(pending.segments, TRAIL_STYLE).addTo(trailLayer);
        pending.lead = L.polyline([], LEAD_STYLE).addTo(trailLayer);
        if (entry) updateTrailLead(entry.shown.lat, entry.shown.lon);
    }

    /**
     * Removes the trail. Given an icao24, only when it is that aircraft's trail:
     * Leaflet fires the old popup's close around the new one's open, and the
     * close must not take down the trail that has just been started.
     */
    function clearTrail(icao24) {
        if (!trail || (icao24 && trail.icao24 !== icao24)) return;
        trailLayer.clearLayers();
        trail = null;
    }

    // ─── Animation Loop ─────────────────────────────────────────────────────────

    // Independent of the fetch cycle: the server is fetched every 30s, but the map
    // redraws continuously so aircraft coast between fixes rather than hopping.
    // requestAnimationFrame pauses itself in a background tab, and because every
    // position is derived from absolute fix time rather than accumulated deltas,
    // returning to the tab lands aircraft exactly where they belong.
    let lastRenderMs = 0;

    function animationTick() {
        const nowMs = Date.now();
        if (nowMs - lastRenderMs >= RENDER_INTERVAL_MS) {
            lastRenderMs = nowMs;
            renderTracks(nowMs);
        }
        requestAnimationFrame(animationTick);
    }

    // ─── Fetch and Render ───────────────────────────────────────────────────────

    async function updateFlights() {
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('aircraft-count');
        const updateEl = document.getElementById('last-update');

        try {
            const response = await fetch('/flights');

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const flights = await response.json();

            const nowMs = Date.now();
            const seen = new Set();
            flights.forEach(flight => {
                // Skip aircraft with no position data
                if (flight.latitude == null || flight.longitude == null) return;
                upsertTrack(flight, nowMs);
                seen.add(flight.icao24);
            });
            pruneTracks(seen);
            renderTracks(nowMs);

            countEl.textContent = seen.size.toLocaleString();
            updateEl.textContent = new Date().toLocaleTimeString();

            statusEl.textContent = 'Live';
            statusEl.className = '';

        } catch (error) {
            console.error('Failed to fetch flights:', error);
            statusEl.textContent = 'Error — retrying';
            statusEl.className = 'error';
        }
    }

    // ─── Start ──────────────────────────────────────────────────────────────────

    updateFlights();
    setInterval(updateFlights, FETCH_INTERVAL_MS);
    requestAnimationFrame(animationTick);

</script>
</body>
</html>
