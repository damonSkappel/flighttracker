<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            z-index: 1000;
        }

        #header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #4fc3f7;
        }

        #stats-bar {
            display: flex;
            gap: 24px;
            font-size: 0.85rem;
            color: #aaa;
        }

        #stats-bar span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #stats-bar .value {
            color: #4fc3f7;
            font-weight: 600;
        }

        #status {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            background: #0f3460;
            color: #4fc3f7;
        }

        #status.error {
            background: #3d0000;
            color: #ff6b6b;
        }

        #map {
            flex: 1;
        }

        .leaflet-popup-content-wrapper {
            background: #16213e;
            color: #eee;
            border: 1px solid #0f3460;
            border-radius: 8px;
        }

        .leaflet-popup-tip {
            background: #16213e;
        }

        .popup-content {
            min-width: 180px;
        }

        .popup-callsign {
            font-size: 1rem;
            font-weight: 700;
            color: #4fc3f7;
            margin-bottom: 8px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 6px;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            margin: 4px 0;
            color: #ccc;
        }

        .popup-row .label {
            color: #888;
        }

        .popup-row .val {
            color: #eee;
            font-weight: 500;
        }
        .aircraft-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plane-icon {
            /* Rotate about the centre so the anchor stays on the position fix. */
            transform-origin: 50% 50%;
            display: block;
        }

        .leaflet-tile {
            filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(90%) saturate(60%);
        }
    </style>
</head>
<body>

<div id="header">
    <h1>✈ FLIGHT TRACKER</h1>
    <div id="stats-bar">
        <span>Aircraft: <span class="value" id="aircraft-count">—</span></span>
        <span>Last update: <span class="value" id="last-update">—</span></span>
    </div>
    <div id="status">Connecting...</div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>

<script>
    // ─── Map Setup ─────────────────────────────────────────────────────────────

    const map = L.map('map', {
        center: [39.5, -98.35],
        zoom: 5,
        zoomControl: true
    });

    // Dark-themed map tiles from CartoDB
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    // LayerGroup to hold all aircraft markers
    const flightLayer = L.markerClusterGroup({
        maxClusterRadius: 40,
        disableClusteringAtZoom: 7,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
        iconCreateFunction: function(cluster) {
            const count = cluster.getChildCount();
            let size = 'small';
            if (count > 100) size = 'medium';
            if (count > 500) size = 'large';
            return L.divIcon({
                html: `<div style="
                background: rgba(79, 195, 247, 0.8);
                border: 2px solid #4fc3f7;
                border-radius: 50%;
                color: #0a0a1a;
                font-weight: 700;
                font-size: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
            ">${count}</div>`,
                className: 'custom-cluster',
                iconSize: count > 500 ? [50, 50] : count > 100 ? [40, 40] : [30, 30],
                iconAnchor: count > 500 ? [25, 25] : count > 100 ? [20, 20] : [15, 15]
            });
        }
    }).addTo(map);
    // ─── Aircraft Icon ──────────────────────────────────────────────────────────

    // Nose points to 12 o'clock at rotation 0, so the CSS rotation is the
    // compass heading verbatim (0 = north, 90 = east). Drawn as inline SVG
    // rather than the U+2708 glyph: that glyph's resting orientation is
    // font-dependent (it pointed east here, putting the left wing on the
    // course line), and it renders as a color emoji on some platforms.
    const PLANE_PATH = 'M12 2 L13.5 7.5 L22 13 L22 15 L13.5 12.5 L13.5 18.5 '
        + 'L16 20.5 L16 22 L12 20.8 L8 22 L8 20.5 L10.5 18.5 L10.5 12.5 '
        + 'L2 15 L2 13 L10.5 7.5 Z';

    function createAircraftIcon(heading, onGround) {
        const color = onGround ? '#888888' : '#4fc3f7';
        const size = onGround ? 16 : 20;
        const rotation = heading != null ? heading : 0;

        return L.divIcon({
            html: `<svg class="plane-icon" viewBox="0 0 24 24" width="${size}" height="${size}"
                 style="transform: rotate(${rotation}deg);">
                <path d="${PLANE_PATH}" fill="${color}"
                      stroke="rgba(10,10,26,0.85)" stroke-width="0.75"
                      stroke-linejoin="round"/>
            </svg>`,
            className: 'aircraft-icon',
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2]
        });
    }

    // ─── Popup Content ──────────────────────────────────────────────────────────

    // Popup HTML is assembled as a string and handed to bindPopup, which assigns
    // it as innerHTML. Callsign and country originate from OpenSky -- operator-
    // supplied strings relayed by a public network -- so they are untrusted and
    // must never reach the parser as markup.
    function esc(value) {
        if (value == null) return '';
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function buildPopup(flight) {
        const callsign = esc(flight.callsign || flight.icao24 || 'Unknown');
        const altitude = flight.altitudeFeet != null
            ? Math.round(flight.altitudeFeet).toLocaleString() + ' ft'
            : '—';
        const speed = flight.velocityKnots != null
            ? Math.round(flight.velocityKnots) + ' kts'
            : '—';
        const heading = flight.heading != null
            ? Math.round(flight.heading) + '°'
            : '—';
        const vertRate = flight.verticalRate != null
            ? (flight.verticalRate > 0 ? '▲ ' : '▼ ')
            + Math.abs(Math.round(flight.verticalRate)) + ' m/s'
            : '—';
        const status = flight.onGround ? '🟡 On Ground' : '🔵 Airborne';

        return `
            <div class="popup-content">
                <div class="popup-callsign">${callsign}</div>
                <div class="popup-row">
                    <span class="label">ICAO24</span>
                    <span class="val">${esc(flight.icao24)}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Country</span>
                    <span class="val">${esc(flight.originCountry) || '—'}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Status</span>
                    <span class="val">${status}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Altitude</span>
                    <span class="val">${altitude}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Speed</span>
                    <span class="val">${speed}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Heading</span>
                    <span class="val">${heading}</span>
                </div>
                <div class="popup-row">
                    <span class="label">Vert. Rate</span>
                    <span class="val">${vertRate}</span>
                </div>
            </div>
        `;
    }

    // ─── Fetch and Render ───────────────────────────────────────────────────────

    async function updateFlights() {
        const statusEl = document.getElementById('status');
        const countEl = document.getElementById('aircraft-count');
        const updateEl = document.getElementById('last-update');

        try {
            const response = await fetch('/flights');

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const flights = await response.json();

            // Clear existing markers
            flightLayer.clearLayers();

            let plotted = 0;

            flights.forEach(flight => {
                // Skip aircraft with no position data
                if (flight.latitude == null || flight.longitude == null) return;

                const marker = L.marker(
                    [flight.latitude, flight.longitude],
                    { icon: createAircraftIcon(flight.heading, flight.onGround) }
                );

                marker.bindPopup(buildPopup(flight), {
                    maxWidth: 220,
                    className: 'flight-popup'
                });

                flightLayer.addLayer(marker);
                plotted++;
            });

            // Update header stats
            countEl.textContent = plotted.toLocaleString();
            updateEl.textContent = new Date().toLocaleTimeString();

            statusEl.textContent = 'Live';
            statusEl.className = '';

        } catch (error) {
            console.error('Failed to fetch flights:', error);
            statusEl.textContent = 'Error — retrying';
            statusEl.className = 'error';
        }
    }

    // ─── Start ──────────────────────────────────────────────────────────────────

    updateFlights();
    setInterval(updateFlights, 15000);

</script>
</body>
</html>
