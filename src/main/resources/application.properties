spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/flighttracker?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USER:flighttracker}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.application.name=flighttracker
server.port=8080

# How long an aircraft stays "active" after its last snapshot. Must stay
# comfortably above the poll interval, or aircraft expire before their
# replacement lands and /flights returns an empty list between polls. Sized at
# three poll cycles, so two consecutive failed polls still leave a full map.
flighttracker.active-window-minutes=6

# How much snapshot history to retain. The hourly cleanup job deletes past this.
flighttracker.retention-hours=6

# index.html carries all the frontend code and ships with no fingerprint, so the
# browser must revalidate rather than serve a heuristically cached copy. With
# Last-Modified this costs a 304, not a re-download.
spring.web.resources.cache.cachecontrol.no-cache=true

# OpenSky OAuth2 client credentials. Left blank the app runs on the anonymous
# tier: 400 credits/day, and this bounding box costs 4 per call, so it runs dry
# about 8 hours in. A free registered account raises that to 4000/day.
opensky.client-id=${OPENSKY_CLIENT_ID:}
opensky.client-secret=${OPENSKY_CLIENT_SECRET:}
