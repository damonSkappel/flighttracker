spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/flighttracker}
spring.datasource.username=${DB_USER:flighttracker}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.application.name=flighttracker
server.port=8080

# How long an aircraft stays "active" after its last snapshot. Must stay
# comfortably above the 5-minute poll interval, or aircraft expire before
# their replacement lands and /flights returns an empty list between polls.
flighttracker.active-window-minutes=15

# How much snapshot history to retain. The hourly cleanup job deletes past this.
flighttracker.retention-hours=6
